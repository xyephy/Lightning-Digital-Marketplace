# Lightning Digital Marketplace - Docker Compose
# Stage 4: Production Ready

version: '3.8'

services:
  lightning-marketplace:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LIGHTNING_BACKEND=polar
      - LIGHTNING_NETWORK=regtest
      - DEBUG=false
      - CORS_ORIGINS=*
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lightning-network

  # Optional: Redis for session storage and caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - lightning-network

networks:
  lightning-network:
    driver: bridge

volumes:
  redis_data: